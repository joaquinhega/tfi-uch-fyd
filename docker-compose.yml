name: tfi-uch-fyd

networks:
  edge:
  backend:
    internal: true

volumes:
  mongo-data:
  stock-db-data:
  pedidos-db-data:
  auditoria-db-data:

secrets:
  jwt_private_key:
    file: ./keys/jwt_private.pem
  jwt_public_key:
    file: ./keys/jwt_public.pem

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    networks: [edge]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build: ./gateway
    env_file: .env
    environment:
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    secrets: [jwt_public_key]
    ports:
      - "${GATEWAY_PORT}:8000"
    networks: [edge, backend]
    depends_on:
      auth-service: { condition: service_healthy }
      stock-service: { condition: service_healthy }
      pedidos-service: { condition: service_healthy }
      auditoria-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Servidor A
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    env_file: .env
    environment:
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    secrets: [jwt_private_key]
    networks: [backend]
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  auditoria-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AUDITORIA_DB_USER}
      POSTGRES_PASSWORD: ${AUDITORIA_DB_PASSWORD}
      POSTGRES_DB: ${AUDITORIA_DB_NAME}
    volumes:
      - auditoria-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDITORIA_DB_USER} -d ${AUDITORIA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auditoria-service:
    build: ./auditoria-service
    env_file: .env
    networks: [backend]
    depends_on:
      auditoria-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Servidor B
  stock-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STOCK_DB_USER}
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD}
      POSTGRES_DB: ${STOCK_DB_NAME}
    volumes:
      - stock-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STOCK_DB_USER} -d ${STOCK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  stock-service:
    build: ./stock-service
    env_file: .env
    networks: [backend]
    depends_on:
      stock-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  pedidos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PEDIDOS_DB_USER}
      POSTGRES_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      POSTGRES_DB: ${PEDIDOS_DB_NAME}
    volumes:
      - pedidos-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PEDIDOS_DB_USER} -d ${PEDIDOS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pedidos-service:
    build: ./pedidos-service
    env_file: .env
    networks: [backend]
    depends_on:
      pedidos-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5